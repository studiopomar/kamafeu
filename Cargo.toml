[package]
name = "kamafeu"
version = "0.1.0"
edition = "2021"
description = "OpenUTAU-style voice synthesizer core in Rust with UTAU voicebank support"

[dependencies]
encoding_rs = "0.8"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.4", features = ["derive"] }
rustfft = "6.1"
eframe = "0.29"
rodio = "0.19"
rfd = "0.14"
midly = "0.5"
image = "0.24"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[dev-dependencies]
tempfile = "3.8"
