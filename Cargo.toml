[package]
name = "kamafeu"
version = "3.1.0"
edition = "2021"
rust-version = "1.82"
description = "Kamafeu Studio - OpenUTAU-style voice synthesizer and DAW in Rust with UTAU voicebank support"
license = "MIT"
default-run = "kamafeu"

[features]
default = ["desktop"]
desktop = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "kamafeu"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "copaiba"
path = "src/bin/copaiba.rs"
required-features = ["desktop"]

[package.metadata.android]
package = "com.studiopomar.kamafeu"
apk_name = "kamafeu"
min_sdk_version = 21
target_sdk_version = 34
resources = "res"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "Kamafeu Studio"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[package.metadata.android.application.activity]
label = "Kamafeu Studio"
# Permite portrait e landscape; o layout seleciona a navegação compacta
# automaticamente quando a largura disponível é pequena.
orientation = "sensor"

[package.metadata.deb]
maintainer = "Studio Pomar"
copyright = "2026, Studio Pomar"
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/kamafeu", "usr/bin/kamafeu", "755"],
  ["target/release/copaiba", "usr/bin/copaiba", "755"],
  ["README.md", "usr/share/doc/kamafeu/README.md", "644"],
  ["LICENSE", "usr/share/doc/kamafeu/LICENSE", "644"],
  ["NOTICE.md", "usr/share/doc/kamafeu/NOTICE.md", "644"],
  ["target/tainah-package/liblessampler_tainah.so.1", "usr/lib/kamafeu/liblessampler_tainah.so.1", "755"],
  ["target/tainah-package/lessampler-ng-LGPL-3.0.txt", "usr/share/doc/kamafeu/lessampler-ng-LGPL-3.0.txt", "644"],
]

[package.metadata.generate-rpm]
version = "3.1.0"
assets = [
  { source = "target/release/kamafeu", dest = "/usr/bin/kamafeu", mode = "755" },
  { source = "target/release/copaiba", dest = "/usr/bin/copaiba", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/kamafeu/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/kamafeu/LICENSE", mode = "644" },
  { source = "NOTICE.md", dest = "/usr/share/licenses/kamafeu/NOTICE.md", mode = "644" },
  { source = "target/tainah-package/liblessampler_tainah.so.1", dest = "/usr/lib/kamafeu/liblessampler_tainah.so.1", mode = "755" },
  { source = "target/tainah-package/lessampler-ng-LGPL-3.0.txt", dest = "/usr/share/licenses/kamafeu/lessampler-ng-LGPL-3.0.txt", mode = "644" },
]

# Release signing is supplied through CARGO_APK_RELEASE_KEYSTORE and
# CARGO_APK_RELEASE_KEYSTORE_PASSWORD (see docs/android-signing.md).

[dependencies]
encoding_rs = "0.8"
hound = "3.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
pinyin = "0.11"
yaml_serde = "0.10"
clap = { version = "4.4", features = ["derive"] }
midly = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3.8"
flacenc = "0.5.1"
web-time = "1.1"
ndarray = "0.17.2"
rustfft = "6.4"
rayon = "1.10"
unicode-normalization = "0.1"
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = "0.19"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
wasmi = "0.31"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
libloading = "0.8"
discord-rich-presence = "0.2.4"
rfd = "0.17"
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.15.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlInputElement", "FileList", "File", "FileReader", "Event", "EventTarget", "Location", "console", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = { version = "1.0", features = ["color"] }
getrandom = { version = "0.2", features = ["js"] }
log = "0.4"

[dev-dependencies]
wat = "1.0"

[[bench]]
name = "dsp_backends"
harness = false

[build-dependencies]
cc = "1.1"



# --------------------------------------------------------------------------
# Profile otimizado para desenvolvimento: compilação rápida + desempenho
# real para código de GUI/DSP (egui, rodio, etc).
# --------------------------------------------------------------------------
[profile.dev]
# Nível 1: compilação rápida com otimização básica no crate principal
opt-level = 1
debug = 1                 # line tables apenas: reduz tamanho do binário e acelera o linker
split-debuginfo = "unpacked" # pula dsymutil no macOS, acelerando linking em até 10x

[profile.dev.package."*"]
# Nível 3: todas as dependências compiladas com otimização total.
# egui, eframe, rodio e similares são altamente sensíveis ao
# nível de otimização — sem isso, o framerate cai para 5-15 FPS.
opt-level = 3

# --------------------------------------------------------------------------
# Profile de Release de Altíssimo Desempenho
# --------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
# Remove debug information and the remaining linker symbols from distributable
# binaries. This does not affect runtime diagnostics: the application already
# writes its own render/error logs, while symbol-heavy release binaries are
# needlessly large (especially with the cdylib target enabled).
strip = "symbols"

# `block 0.1.6` declares `_NSConcreteStackBlock` with an uninhabited enum,
# which triggers a Rust future-incompatibility lint. Keep the upstream API and
# ABI while using an inhabited opaque type until the dependency fixes it.
[patch.crates-io]
block = { path = "vendor/block" }
