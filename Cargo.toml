[package]
name = "kamafeu"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.82"
description = "OpenUTAU-style voice synthesizer core in Rust with UTAU voicebank support"
default-run = "kamafeu"

[dependencies]
encoding_rs = "0.8"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"
clap = { version = "4.4", features = ["derive"] }
rustfft = "6.1"
eframe = "0.29"
rodio = "0.19"
rfd = "0.17"
midly = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
tempfile = "3.8"
rayon = "1.10"


# --------------------------------------------------------------------------
# Profile otimizado para desenvolvimento: compilação rápida + desempenho
# real para código de GUI/DSP (egui, rodio, rustfft, etc).
# --------------------------------------------------------------------------
[profile.dev]
# Nível 1: habilita otimizações básicas (auto-vectorização, inlining) no
# crate principal sem um tempo de compilação muito longo.
opt-level = 1
debug = true          # mantém informações de debug / rastreamentos de pilha

[profile.dev.package."*"]
# Nível 3: todas as dependências compiladas com otimização total.
# egui, eframe, rodio, rustfft e similares são altamente sensíveis ao
# nível de otimização — sem isso, o framerate cai para 5-15 FPS.
opt-level = 3

