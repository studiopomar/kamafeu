# Dependencies needed by the native audio and windowing backends when the
# Linux release targets are built inside cross containers.

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "echo 'deb http://archive.ubuntu.com/ubuntu focal main universe' > /etc/apt/sources.list.d/focal.list",
  "apt-get update",
  "DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold -t focal install -y libssl-dev",
  "DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold install -y pkg-config libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev",
]

