# Dependencies needed by the native audio and windowing backends when the
# Linux release targets are built inside cross containers.

[target.aarch64-unknown-linux-gnu]
pre-build = [
  "apt-get update",
  "DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold install -y pkg-config libssl-dev libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
  "apt-get update",
  "DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold install -y pkg-config libssl-dev libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev",
]

[target.x86_64-unknown-linux-musl]
pre-build = [
  "apt-get update",
  "DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold install -y pkg-config libssl-dev libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev",
]
