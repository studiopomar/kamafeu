name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Describe one problem per report. Include enough detail for someone else to reproduce it.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the actions that lead to the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or project files
      description: Add screenshots or relevant error output. Remove private information before sharing.
      render: text
  - type: input
    id: version
    attributes:
      label: Kamafeu version
      placeholder: e.g. 3.0.0
  - type: input
    id: environment
    attributes:
      label: Operating system and version
      placeholder: e.g. macOS 15.1, Windows 11, Ubuntu 24.04
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help diagnose the problem.
