name: Discord Release & Commit Notification

on:
  release:
    types: [published]
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Bidu Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$EVENT_NAME" = "release" ]; then
            TITLE="🚀 Lançamento Publicado: ${RELEASE_NAME:-$REF_NAME}"
            URL="$RELEASE_URL"
            DESC="$RELEASE_BODY"
            COLOR=65280
          elif [[ "$REF_NAME" == v* ]]; then
            TITLE="🏷️ Nova Tag / Versão: $REF_NAME"
            URL="https://github.com/$REPOSITORY/releases/tag/$REF_NAME"
            DESC="Nova versão tagged enviada por @$ACTOR!"
            COLOR=16753920
          else
            TITLE="🔨 Novo Push em $REF_NAME"
            URL="${COMMIT_URL:-https://github.com/$REPOSITORY/commits/$REF_NAME}"
            DESC="${COMMIT_MESSAGE:-Novas atualizações no repositório por @$ACTOR!}"
            COLOR=3447003
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg desc "${DESC:-Sem descrição detalhada.}" \
            --arg username "Bidu" \
            '{
              username: $username,
              content: "🐶 **Bidu informa atualizações no Kamafeu!**",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: ($color | tonumber),
                footer: { text: "studiopomar/kamafeu • GitHub" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }' --arg color "$COLOR")

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
