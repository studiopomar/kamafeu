name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (ARM64 & ARMv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-30" "platforms;android-33" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Cargo & NDK builds
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: |
          cargo install cargo-apk --locked

      - name: Generate Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          printf '\n[package.metadata.android.signing.release]\npath = "release.keystore"\nkeystore_password = "%s"\nkey_alias = "%s"\nkey_password = "%s"\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" >> Cargo.toml

      - name: Build Android APK (Release ARM64)
        run: |
          unset ANDROID_SDK_ROOT
          cargo apk build --lib --release --target aarch64-linux-android

      - name: Prepare APK Artifacts
        run: |
          mkdir -p ./apk_output
          TAG_OR_REF="${{ github.ref_name }}"
          if [ -z "$TAG_OR_REF" ] || [ "$TAG_OR_REF" = "main" ]; then
            TAG_OR_REF="latest"
          fi
          
          # Localizar o APK gerado
          APK_FILE=$(find target -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "./apk_output/kamafeu-${TAG_OR_REF}-android-arm64.apk"
            echo "APK generated successfully: ./apk_output/kamafeu-${TAG_OR_REF}-android-arm64.apk"
          else
            echo "Error: No APK found in target/"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kamafeu-android-apk
          path: ./apk_output/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk_output/*.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification for APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          RELEASE_URL="https://github.com/$REPOSITORY/releases/tag/$TAG_NAME"
          
          PAYLOAD=$(jq -n \
            --arg title "📱 Kamafeu $TAG_NAME para Android (.APK) Disponível!" \
            --arg url "$RELEASE_URL" \
            --arg desc "O pacote Android (.apk) para dispositivos ARM64 foi compilado e anexado à release oficial!" \
            --arg username "Bidu" \
            '{
              username: $username,
              content: "🐶 **Bidu avisa: Build Mobile Android (.APK) Disponível no GitHub Releases!**",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5814783,
                fields: [
                  { name: "📱 Android ARM64 (.apk)", value: ("[Download .apk](" + $url + ")"), inline: true }
                ],
                footer: { text: "studiopomar/kamafeu • Mobile Release" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true
