name: Build & Publish Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: kamafeu-release-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Build Tainah WORLD library and run ABI test
        run: python3 native/tainah/build.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        env:
          TAINAH_LIBRARY_PATH: target/tainah-package/libtainah_motor.so.1
        run: cargo test --all-targets --all-features --locked
      - name: Run Clippy
        # O CI principal executa Clippy sem promover avisos legados a erros.
        # Mantemos a análise no release sem bloquear os artefatos por
        # `multiple_bound_locations`, `too_many_arguments` e reassignments
        # existentes no CLI.
        run: cargo clippy --all-targets --all-features --locked
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    name: Build ${{ matrix.job.name }}
    needs: quality
    # A failure in a promised desktop target blocks publication. Secondary
    # architectures remain best-effort until they have native smoke coverage.
    continue-on-error: ${{ !matrix.job.blocking }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: kamafeu.exe
            toolkit_binary: copaiba.exe
            archive: kamafeu-${{ github.ref_name }}-windows-x64.zip
            use_cross: false
            blocking: true
            smoke_test: true

          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: kamafeu.exe
            toolkit_binary: copaiba.exe
            archive: kamafeu-${{ github.ref_name }}-windows-arm64.zip
            use_cross: false
            blocking: false
            smoke_test: false

          - name: Windows x86 (32-bit)
            os: windows-latest
            target: i686-pc-windows-msvc
            binary: kamafeu.exe
            toolkit_binary: copaiba.exe
            archive: kamafeu-${{ github.ref_name }}-windows-x86.zip
            use_cross: false
            blocking: false
            smoke_test: true

          - name: macOS Apple Silicon (ARM64)
            os: macos-15
            target: aarch64-apple-darwin
            binary: kamafeu
            toolkit_binary: copaiba
            archive: kamafeu-${{ github.ref_name }}-macos-arm64.dmg
            use_cross: false
            blocking: true

          - name: macOS Intel (x86_64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: kamafeu
            toolkit_binary: copaiba
            archive: kamafeu-${{ github.ref_name }}-macos-x86_64.dmg
            use_cross: false
            blocking: true

          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: kamafeu
            toolkit_binary: copaiba
            archive: kamafeu-${{ github.ref_name }}-linux-x64.tar.gz
            use_cross: false
            blocking: true

          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: kamafeu
            toolkit_binary: copaiba
            archive: kamafeu-${{ github.ref_name }}-linux-arm64.tar.gz
            use_cross: true
            blocking: false

          - name: Linux ARMv7 (32-bit)
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            binary: kamafeu
            toolkit_binary: copaiba
            archive: kamafeu-${{ github.ref_name }}-linux-armv7.tar.gz
            use_cross: true
            blocking: false

          - name: Linux musl x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: kamafeu
            toolkit_binary: copaiba
            archive: kamafeu-${{ github.ref_name }}-linux-musl-x64.tar.gz
            use_cross: true
            blocking: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.job.os == 'ubuntu-latest' && matrix.job.use_cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.job.target }}

      - name: Build Tainah WORLD library and run ABI test
        if: matrix.job.use_cross == false
        env:
          TAINAH_WINDOWS_ARCH: ${{ matrix.job.target == 'aarch64-pc-windows-msvc' && 'ARM64' || matrix.job.target == 'i686-pc-windows-msvc' && 'Win32' || 'x64' }}
        run: python3 native/tainah/build.py

      - name: Build Binary (Native)
        if: matrix.job.use_cross == false
        run: cargo build --release --bins --target ${{ matrix.job.target }} --locked

      - name: Build FTXUI terminal dashboard
        if: matrix.job.blocking == true
        run: |
          cmake -S native/console_tui -B target/console-tui-build -DCMAKE_BUILD_TYPE=Release
          cmake --build target/console-tui-build --config Release --parallel 2

      - name: Test FTXUI terminal transport
        if: matrix.job.blocking == true && matrix.job.os != 'windows-latest'
        run: ctest --test-dir target/console-tui-build --output-on-failure

      - name: Install cross
        if: matrix.job.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build Binary (Cross)
        if: matrix.job.use_cross == true
        run: cross build --release --bins --target ${{ matrix.job.target }} --locked

      - name: Build Bundled External Resamplers (straycat-rs & organum)
        if: matrix.job.use_cross == false
        run: |
          cargo install --git https://github.com/UtaUtaUtau/straycat-rs.git --target ${{ matrix.job.target }} --root ./resamplers_dist straycat-rs
          cargo install --git https://github.com/KakouLabs/Organum.git --target ${{ matrix.job.target }} --root ./resamplers_dist organum

      - name: Prepare Artifacts (Windows)
        if: matrix.job.os == 'windows-latest'
        shell: powershell
        run: |
          $bin_path = "target/${{ matrix.job.target }}/release/${{ matrix.job.binary }}"
          $toolkit_path = "target/${{ matrix.job.target }}/release/${{ matrix.job.toolkit_binary }}"
          if (-Not (Test-Path $bin_path)) { throw "Missing Studio binary: $bin_path" }
          if (-Not (Test-Path $toolkit_path)) { throw "Missing Copaiba binary: $toolkit_path" }

          New-Item -ItemType Directory -Force -Path "package_root/resamplers"
          Copy-Item $bin_path -Destination "package_root/kamafeu.exe"
          Copy-Item $toolkit_path -Destination "package_root/copaiba.exe"
          Copy-Item "README.md", "LICENSE", "NOTICE.md" -Destination "package_root/"
          Copy-Item "target/tainah-package/tainah_motor.dll" -Destination "package_root/"
          Copy-Item "target/tainah-package/licenca-da-base-LGPL-3.0.txt" -Destination "package_root/"
          if ("${{ matrix.job.blocking }}" -eq "true") {
            Copy-Item "target/console-tui-build/bin/Release/kamafeu-tui.exe" -Destination "package_root/"
          }

          # Recent `ort` builds may statically link ONNX Runtime. If a build
          # selects the dynamic variant, keep its DLL beside the executable;
          # the launch smoke test below validates either layout.
          $onnx_dll = Get-ChildItem -Path "target/${{ matrix.job.target }}/release", "target/${{ matrix.job.target }}/release/deps" -Filter "onnxruntime*.dll" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($onnx_dll) {
            Copy-Item $onnx_dll.FullName -Destination "package_root/"
          } else {
            Write-Host "No ONNX Runtime DLL found; ort is statically linked in this build."
          }

          if (Test-Path "resamplers_dist/bin") {
            Copy-Item "resamplers_dist/bin/*" -Destination "package_root/resamplers/" -Force
          }
          if (Test-Path "resamplers/README.md") {
            Copy-Item "resamplers/README.md" -Destination "package_root/resamplers/" -Force
          }
          if (Test-Path "resamplers/licenses") {
            Copy-Item "resamplers/licenses" -Destination "package_root/resamplers/" -Recurse -Force
          }

          # Fail the release job if the packaged GUI exits immediately (for
          # example because a native DLL or graphics dependency is missing).
          if ("${{ matrix.job.smoke_test }}" -eq "true") {
            $smoke = Start-Process -FilePath "package_root/kamafeu.exe" -WorkingDirectory "package_root" -PassThru
            Start-Sleep -Seconds 8
            if ($smoke.HasExited) { throw "Kamafeu exited during the Windows launch smoke test (exit code $($smoke.ExitCode))" }
            Stop-Process -Id $smoke.Id -Force
          } else {
            Write-Host "Skipping launch smoke test for the ARM64 binary on the x64 runner."
          }

          Compress-Archive -Path "package_root/*" -DestinationPath "${{ matrix.job.archive }}" -Force

      - name: Prepare Artifacts (Unix / Linux / macOS)
        if: matrix.job.os != 'windows-latest' && matrix.job.use_cross == false
        run: |
          BIN_PATH="target/${{ matrix.job.target }}/release/${{ matrix.job.binary }}"
          TOOLKIT_PATH="target/${{ matrix.job.target }}/release/${{ matrix.job.toolkit_binary }}"
          test -f "$BIN_PATH"
          test -f "$TOOLKIT_PATH"
          mkdir -p package_root/resamplers
          if [[ "${{ matrix.job.os }}" == "macos-15" || "${{ matrix.job.os }}" == "macos-15-intel" || "${{ matrix.job.os }}" == "macos-13" ]]; then
            mkdir -p package_root/Kamafeu.app/Contents/MacOS package_root/Kamafeu.app/Contents/Resources
            cp "$BIN_PATH" package_root/Kamafeu.app/Contents/MacOS/kamafeu
            if [[ "${{ matrix.job.blocking }}" == "true" ]]; then
              cp target/console-tui-build/bin/Release/kamafeu-tui package_root/Kamafeu.app/Contents/MacOS/
            fi
            cp assets/icon.png package_root/Kamafeu.app/Contents/Resources/icon.png
            cp "$TOOLKIT_PATH" package_root/copaiba
            cat > package_root/Kamafeu.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Kamafeu Studio</string>
            <key>CFBundleDisplayName</key><string>Kamafeu Studio</string>
            <key>CFBundleIdentifier</key><string>com.studiopomar.kamafeu</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>CFBundleExecutable</key><string>kamafeu</string>
            <key>CFBundleIconFile</key><string>icon.png</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          PLIST
          else
            cp "$BIN_PATH" package_root/kamafeu
            cp "$TOOLKIT_PATH" package_root/copaiba
            if [[ "${{ matrix.job.blocking }}" == "true" ]]; then
              cp target/console-tui-build/bin/Release/kamafeu-tui package_root/
            fi
          fi
          cp README.md LICENSE NOTICE.md package_root/
          if [[ "${{ matrix.job.os }}" == *"macos"* ]]; then
            mkdir -p package_root/Kamafeu.app/Contents/Frameworks
            cp target/tainah-package/libtainah_motor.dylib package_root/Kamafeu.app/Contents/Frameworks/
            cp target/tainah-package/libtainah_motor.dylib package_root/
          else
            cp target/tainah-package/libtainah_motor.so.1 package_root/
          fi
          cp target/tainah-package/licenca-da-base-LGPL-3.0.txt package_root/

          # Include compiled resamplers
          if [ -d "resamplers_dist/bin" ]; then
            cp resamplers_dist/bin/* package_root/resamplers/ 2>/dev/null || true
          fi

          # Include repository bundled resamplers and licenses
          if [ -f "resamplers/README.md" ]; then
            cp resamplers/README.md package_root/resamplers/
          fi
          if [ -d "resamplers/licenses" ]; then
            cp -R resamplers/licenses package_root/resamplers/
          fi
          if [[ "${{ matrix.job.target }}" == "x86_64-apple-darwin" ]]; then
            if [ -f "resamplers/macres" ]; then
              cp resamplers/macres package_root/resamplers/
            fi
          fi

          chmod +x package_root/copaiba
          if [ -f package_root/kamafeu ]; then chmod +x package_root/kamafeu; fi
          if [ -f package_root/Kamafeu.app/Contents/MacOS/kamafeu ]; then chmod +x package_root/Kamafeu.app/Contents/MacOS/kamafeu; fi
          if [ -d "package_root/resamplers" ]; then
            chmod +x package_root/resamplers/* 2>/dev/null || true
          fi

          if [[ "${{ matrix.job.os }}" == *"macos"* ]]; then
            python3 scripts/release-smoke.py package_root/Kamafeu.app/Contents/MacOS/kamafeu
            hdiutil create -volname "Kamafeu" -srcfolder package_root -ov -format UDZO "${{ matrix.job.archive }}"
          else
            xvfb-run -a python3 scripts/release-smoke.py package_root/kamafeu
            tar -czvf "${{ matrix.job.archive }}" -C package_root .
          fi

      - name: Upload Artifact
        if: matrix.job.use_cross == false
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.archive }}
          path: ${{ matrix.job.archive }}

  create-release:
    name: Create GitHub Release & Notify Discord
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten Artifacts & Generate SHA256 Checksums
        run: |
          mkdir -p ./release_assets
          find ./artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.dmg" \) -exec cp {} ./release_assets/ \;
          cd ./release_assets
          sha256sum * > SHA256SUMS.txt
          ls -la

          VERSION="${GITHUB_REF_NAME#v}"
          MAC_ARM="kamafeu-${GITHUB_REF_NAME}-macos-arm64.dmg"
          MAC_INTEL="kamafeu-${GITHUB_REF_NAME}-macos-x86_64.dmg"
          LINUX_X64="kamafeu-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          WINDOWS_X64="kamafeu-${GITHUB_REF_NAME}-windows-x64.zip"
          test -f "$MAC_ARM" -a -f "$MAC_INTEL" -a -f "$LINUX_X64" -a -f "$WINDOWS_X64"
          MAC_ARM_SHA=$(sha256sum "$MAC_ARM" | awk '{print $1}')
          MAC_INTEL_SHA=$(sha256sum "$MAC_INTEL" | awk '{print $1}')
          LINUX_X64_SHA=$(sha256sum "$LINUX_X64" | awk '{print $1}')
          WINDOWS_X64_SHA=$(sha256sum "$WINDOWS_X64" | awk '{print $1}')

          cat > kamafeu.rb <<FORMULA
          class Kamafeu < Formula
            desc "Editor e sintetizador vocal baseado em amostragem e splicing"
            homepage "https://github.com/studiopomar/kamafeu"
            version "$VERSION"
            license "MIT"
            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/studiopomar/kamafeu/releases/download/${GITHUB_REF_NAME}/$MAC_ARM"
                sha256 "$MAC_ARM_SHA"
              else
                url "https://github.com/studiopomar/kamafeu/releases/download/${GITHUB_REF_NAME}/$MAC_INTEL"
                sha256 "$MAC_INTEL_SHA"
              end
            end
            on_linux do
              url "https://github.com/studiopomar/kamafeu/releases/download/${GITHUB_REF_NAME}/$LINUX_X64"
              sha256 "$LINUX_X64_SHA"
            end
            def install
              bin.install "kamafeu"
              bin.install "copaiba"
            end
            test do
              assert_match "kamafeu", shell_output("#{bin}/kamafeu --help")
            end
          end
          FORMULA
          sed -i 's/^          //' kamafeu.rb

          cat > studiopomar.Kamafeu.yaml <<WINGET
          PackageIdentifier: studiopomar.Kamafeu
          PackageVersion: $VERSION
          PackageLocale: en-US
          Publisher: Studio Pomar
          PackageName: Kamafeu Studio
          License: MIT
          ShortDescription: Voice editor and synthesizer based on UTAU sampling and splicing.
          Installers:
            - Architecture: x64
              InstallerType: zip
              InstallerUrl: https://github.com/studiopomar/kamafeu/releases/download/${GITHUB_REF_NAME}/$WINDOWS_X64
              InstallerSha256: $WINDOWS_X64_SHA
          ManifestType: singleton
          ManifestVersion: 1.6.0
          WINGET
          sed -i 's/^          //' studiopomar.Kamafeu.yaml

      - name: Publish Official GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release_assets/*
          name: Kamafeu Pre-release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification (Bidu)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          if [ -z "$RELEASE_URL" ]; then
            RELEASE_URL="https://github.com/$REPOSITORY/releases/tag/$TAG_NAME"
          fi

          PAYLOAD=$(jq -n \
            --arg title "🚀 Kamafeu $TAG_NAME Publicado no GitHub Releases!" \
            --arg url "$RELEASE_URL" \
            --arg download_url "$RELEASE_URL" \
            --arg desc "Todos os binários oficiais foram compilados e estão disponíveis para download direto!" \
            --arg username "Bidu" \
            '{
              username: $username,
              content: "🐶 **Bidu avisa: Binários Oficiais do Kamafeu Publicados no GitHub Releases!**",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 65280,
                fields: [
                  { name: "💻 Windows x64", value: ("[Download .zip](" + $download_url + ")"), inline: true },
                  { name: "💻 Windows x86 (32-bit)", value: ("[Download .zip](" + $download_url + ")"), inline: true },
                  { name: "🍏 macOS Apple Silicon", value: ("[Download .dmg](" + $download_url + ")"), inline: true },
                  { name: "🍎 macOS Intel", value: ("[Download .dmg](" + $download_url + ")"), inline: true },
                  { name: "🐧 Linux x64", value: ("[Download .tar.gz](" + $download_url + ")"), inline: true }
                ],
                footer: { text: "studiopomar/kamafeu • Releases Oficial" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
