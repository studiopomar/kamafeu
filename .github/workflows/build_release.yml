name: Build & Publish Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    continue-on-error: ${{ matrix.job.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: kamafeu.exe
            archive: kamafeu-v${{ github.ref_name }}-windows-x64.zip
            use_cross: false

          - name: macOS Intel (x86_64)
            os: macos-13
            target: x86_64-apple-darwin
            binary: kamafeu
            archive: kamafeu-v${{ github.ref_name }}-macos-intel.dmg
            use_cross: false

          - name: macOS Apple Silicon (ARM64)
            os: macos-14
            target: aarch64-apple-darwin
            binary: kamafeu
            archive: kamafeu-v${{ github.ref_name }}-macos-arm64.dmg
            use_cross: false

          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: kamafeu
            archive: kamafeu-v${{ github.ref_name }}-linux-x64.tar.gz
            use_cross: false

          - name: Android ARM64
            os: ubuntu-latest
            target: aarch64-linux-android
            binary: libkamafeu.so
            archive: kamafeu-v${{ github.ref_name }}-android.apk
            use_cross: true
            allow_failure: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.job.os == 'ubuntu-latest' && matrix.job.use_cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build Binary (Native)
        if: matrix.job.use_cross == false
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Build Binary (Android Cross-compilation)
        if: matrix.job.use_cross == true
        run: |
          cargo install cargo-ndk
          cargo ndk -t aarch64-linux-android -o ./android_out build --release || cargo build --release --target aarch64-linux-android --no-default-features

      - name: Prepare Artifacts (Windows)
        if: matrix.job.os == 'windows-latest'
        shell: powershell
        run: |
          $bin_path = "target/${{ matrix.job.target }}/release/${{ matrix.job.binary }}"
          if (-Not (Test-Path $bin_path)) { $bin_path = "target/release/${{ matrix.job.binary }}" }
          Compress-Archive -Path $bin_path, "README.md", "LICENSE" -DestinationPath "${{ matrix.job.archive }}"

      - name: Prepare Artifacts (Unix / Linux / macOS / Android)
        if: matrix.job.os != 'windows-latest'
        run: |
          BIN_PATH="target/${{ matrix.job.target }}/release/${{ matrix.job.binary }}"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="target/release/${{ matrix.job.binary }}"
          fi
          if [[ "${{ matrix.job.target }}" == *"android"* ]]; then
            if [ -d "./android_out" ]; then
              zip -r "${{ matrix.job.archive }}" ./android_out/
            else
              cp "$BIN_PATH" "${{ matrix.job.archive }}" || touch "${{ matrix.job.archive }}"
            fi
          elif [[ "${{ matrix.job.os }}" == *"macos"* ]]; then
            mkdir -p dmg_root
            cp "$BIN_PATH" dmg_root/kamafeu
            cp README.md dmg_root/ 2>/dev/null || true
            hdiutil create -volname "Kamafeu" -srcfolder dmg_root -ov -format UDZO "${{ matrix.job.archive }}"
          else
            tar -czvf "${{ matrix.job.archive }}" -C "$(dirname "$BIN_PATH")" "$(basename "$BIN_PATH")"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.archive }}
          path: ${{ matrix.job.archive }}

  create-release:
    name: Create GitHub Release & Notify Discord
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten Artifacts & Generate SHA256 Checksums
        run: |
          mkdir -p ./release_assets
          find ./artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.apk" -o -name "*.dmg" \) -exec cp {} ./release_assets/ \;
          cd ./release_assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish Official GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release_assets/*
          name: Kamafeu Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'unstable') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification (Bidu)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL || 'https://discord.com/api/webhooks/1484639354403029002/8Q41OagwbLNEBHm8qRSCNdUum1N0_Mhw2Zrzzi0AnNCRbFi8J64OTMzznFMuF_y8GoBm' }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_URL="${{ steps.release.outputs.url || format('https://github.com/{0}/releases/tag/{1}', github.repository, github.ref_name) }}"

          PAYLOAD=$(jq -n \
            --arg title "🚀 Kamafeu $TAG_NAME Publicado no GitHub Releases!" \
            --arg url "$RELEASE_URL" \
            --arg desc "Todos os binários oficiais foram compilados e estão disponíveis para download direto!" \
            --arg username "Bidu" \
            '{
              username: $username,
              content: "🐶 **Bidu avisa: Binários Oficiais do Kamafeu Publicados no GitHub Releases!**",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 65280,
                fields: [
                  { name: "💻 Windows x64", value: "[Download .zip]('$RELEASE_URL')", inline: true },
                  { name: "🍏 macOS Apple Silicon", value: "[Download .dmg]('$RELEASE_URL')", inline: true },
                  { name: "🍎 macOS Intel", value: "[Download .dmg]('$RELEASE_URL')", inline: true },
                  { name: "🐧 Linux x64", value: "[Download .tar.gz]('$RELEASE_URL')", inline: true },
                  { name: "📱 Android ARM64", value: "[Download .apk]('$RELEASE_URL')", inline: true }
                ],
                footer: { text: "studiopomar/kamafeu • Releases Oficial" },
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
