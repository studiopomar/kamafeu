name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Tainah WORLD library and run ABI test
        run: python3 native/tainah/build.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Run tests
        env:
          TAINAH_LIBRARY_PATH: target/tainah-package/libtainah_motor.so.1
        run: cargo test --all-targets --all-features --locked

      - name: Check release build
        run: cargo check --release --all-targets --locked

      - name: Check x86-64 SIMD paths
        run: cargo check --target x86_64-unknown-linux-gnu --lib --locked

      - name: Check WASM platform contract
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings
          cargo check --target wasm32-unknown-unknown --no-default-features --locked

      - name: Check WASI platform contract
        run: |
          rustup target add wasm32-wasip2
          cargo check --target wasm32-wasip2 --no-default-features --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
