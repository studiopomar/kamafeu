app-id: org.studiopomar.Kamafeu
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: kamafeu
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
modules:
  - name: kamafeu
    buildsystem: simple
    build-commands:
      - install -Dm755 kamafeu /app/bin/kamafeu
      - install -Dm755 copaiba /app/bin/copaiba
      - install -Dm644 packaging/kamafeu.desktop /app/share/applications/org.studiopomar.Kamafeu.desktop
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/kamafeu.png
    sources:
      - type: dir
        path: flatpak-context
