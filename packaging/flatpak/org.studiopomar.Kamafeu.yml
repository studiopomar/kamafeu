app-id: org.studiopomar.Kamafeu
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: kamafeu
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
modules:
  - name: kamafeu
    buildsystem: simple
    build-commands:
      - install -Dm755 target/release/kamafeu /app/bin/kamafeu
      - install -Dm755 target/console-tui-build/bin/Release/kamafeu-tui /app/bin/kamafeu-tui
      - install -Dm755 target/release/copaiba /app/bin/copaiba
      - install -Dm755 target/tainah-package/libtainah_motor.so.1 /app/lib/kamafeu/libtainah_motor.so.1
      - install -Dm644 target/tainah-package/licenca-da-base-LGPL-3.0.txt /app/share/licenses/kamafeu/licenca-da-base-LGPL-3.0.txt
      - install -Dm644 packaging/kamafeu.desktop /app/share/applications/org.studiopomar.Kamafeu.desktop
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/kamafeu.png
    sources:
      - type: dir
        path: .
